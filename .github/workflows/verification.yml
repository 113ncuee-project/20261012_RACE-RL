name: Research verification
on: [push, pull_request]
jobs:
  prototype:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[rl,cnn,reports]'
      - run: python tools/verify_sources.py
      - run: python tools/run_ci_tests.py
      - run: race-rl evaluate --out experiments/runs/ci_evaluation
      - run: race-rl train --episodes 1 --budget 4 --out experiments/runs/ci_training
      - run: race-rl validate-cnn --model resnet18 --input-size 32 --precision float64 --analytical-check --guarded-memory --out experiments/runs/ci_cnn
      - run: race-rl search-mesh --requirements configs/vendor_requirements.json --model resnet18 --input-size 32 --compute-counts 2 16 --episodes 1 --budget 2 --max-scope 1 --out experiments/runs/ci_joint_search
      - run: python tools/train_model_suite.py --model resnet18 --smoke --evaluation-seeds 1007 --out experiments/runs/ci_suite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            experiments/runs/ci_logs
            experiments/runs/ci_suite/*/execution.log
            experiments/runs/ci_suite/status.json
          retention-days: 7
