[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "race-rl"
version = "0.9.0"
description = "Auditable analytical chiplet mapping research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3"]

[project.optional-dependencies]
rl = ["torch>=2.7,<3"]
cnn = ["torch>=2.7,<3", "torchvision>=0.22,<1"]
reports = ["matplotlib>=3.8,<4"]

[project.scripts]
race-rl = "race_rl.cli:main"
race-rl-gui = "race_gui.server:main"
race-rl-cnn = "race_rl.accelerators.cnn_search:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
race_gui = ["static/*.html", "static/*.css", "static/*.js"]
race_rl = ["accelerators/*.json"]
